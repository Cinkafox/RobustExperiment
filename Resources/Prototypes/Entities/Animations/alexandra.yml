- type: bodyAnimation
  id: alexandraStandby
  animation:
    length: 1s
    looped: true
    tracks:
      - bone: left-shoulder
        componentType: Content.Shared.Transform.Transform3dComponent
        property: LocalAngleAsVector
        interpolationMode: Linear
        keyFrames:
          - keyTime: 0
            value: 0,0,-0.96
      - bone: right-shoulder
        componentType: Content.Shared.Transform.Transform3dComponent
        property: LocalAngleAsVector
        interpolationMode: Linear
        keyFrames:
          - keyTime: 0
            value: 0,3.14,-0.96
      - bone: hip
        componentType: Content.Shared.Transform.Transform3dComponent
        property: LocalAngleAsVector
        interpolationMode: Cubic
        keyFrames:
          - keyTime: 0
            value: 0,0,0
      - bone: left-leg
        componentType: Content.Shared.Transform.Transform3dComponent
        property: LocalAngleAsVector
        interpolationMode: Cubic
        keyFrames:
          - keyTime: 0
            value: 0,0,0
      - bone: right-leg
        componentType: Content.Shared.Transform.Transform3dComponent
        property: LocalAngleAsVector
        interpolationMode: Cubic
        keyFrames:
          - keyTime: 0
            value: 0,3.1416,0


