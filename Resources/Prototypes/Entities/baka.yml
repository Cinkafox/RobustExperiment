- type: entity
  id: machine
  components:
    - type: Model
      currentMesh:
        path: "/Models/machine/machine.obj"
        offset: 0,-2.2,0
    - type: RigidBody
      physType: Static
      restitution: 0
      shape:
        !type:BoxShape
        halfExtents: 1.2, 0.7, 0.9        

- type: entity
  id: cylinder
  components:
    - type: Model
      currentMesh:
        path: "/Models/wheel/lowpoly__wheel.obj"
        rotation: 90,0,0
        scale: 2,2,2
    - type: RigidBody
      friction: 3
      restitution: 0.2
      density: 10
      shape:
        !type:CylinderShape
        radius: 0.5
        height: 0.5

- type: entity
  id: floor
  components:
    - type: RigidBody
      physType: Static
      restitution: 0
      shape:
        !type:PlaneShape
        distance: 1
    - type: Model
      currentMesh:
        path: "/Models/ohfuck/yösoghfiösbge.obj"
        scale: 5,5,5
        offset: 5,0,0
- type: entity
  id: nyash
  components:
    - type: Model
      currentMesh: "/Models/nyash/Nyash.obj"

- type: entity
  id: mambo
  components:
    - type: Model
      currentMesh: 
        path: "/Models/mambo/Mambo.obj"
        scale: 0.02,0.02,0.02
      
- type: entity
  id: femboy
  components:
    - type: Model
      currentMesh: "/Models/femboy/femboy.obj"