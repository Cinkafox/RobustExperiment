- type: entity
  id: machine
  components:
    - type: Model
      currentMesh:
        path: "/Models/machine/machine.obj"
        offset: 0,-2.2,0
    - type: RigidBody
      physType: Static
      restitution: 0
      shape:
        !type:BoxShape
        halfExtents: 1.2, 0.7, 0.9        

- type: entity
  id: cylinder
  components:
    - type: Model
      currentMesh:
        path: "/Models/wheel/lowpoly__wheel.obj"
        rotation: 90,0,0
        scale: 2,2,2
    - type: RigidBody
      friction: 1
      restitution: 0
      density: 30
      shape:
        !type:CylinderShape
        radius: 0.5
        height: 0.5      

# TODO: Надо найти оптимальные параметры для тестовой машинки
- type: entity
  id: testConstr
  components:
    - type: Model
      currentMesh:
        path: "/Models/mambo/Mambo.obj"
        rotation: 90,0,90
        offset: 2,0,0
        scale: 0.05,0.05,0.05
    - type: RigidBody
      density: 75
      shape:
        !type:BoxShape
        halfExtents: 1.2, 0.2, 0.9
    - type: EntityConstraint
      constraints:
        - entity: cylinder
          bodyConstraint: !type:HingeConstraint
            localAnchorA: 1.2, 0, 1.2
            localAnchorB: 0, 0, 0
            axis: 0, 0, 1
            axisB: 0, -1, 0
        - entity: cylinder
          components:
            - type: CarWheelSteering
            - type: CarWheel
              direction: 0,1,0
              speed: 0
          bodyConstraint: !type:HingeConstraint
            localAnchorA: -1.2, 0, 1.2
            localAnchorB: 0, 0, 0
            axis: 0, 0, 1
            axisB: 0, -1, 0
        - entity: cylinder
          bodyConstraint: !type:HingeConstraint
            localAnchorA: 1.2, 0, -1.3
            localAnchorB: 0, 0, 0
            axis: 0, 0, -1
            axisB: 0, -1, 0
        - entity: cylinder
          components:
            - type: CarWheelSteering
            - type: CarWheel
              direction: 0,-1,0
              speed: 0
          bodyConstraint: !type:HingeConstraint
            localAnchorA: -1.2, 0, -1.3
            localAnchorB: 0, 0, 0
            axis: 0, 0, -1
            axisB: 0, -1, 0
        - entity: remote
          offset: 5,3,0

- type: entity
  id: floor
  components:
    - type: RigidBody
      physType: Static
      friction: 1
      shape:
        !type:PlaneShape
        distance: 1
    - type: Model
      currentMesh:
        path: "/Models/ohfuck/yösoghfiösbge.obj"
        scale: 5,5,5
        offset: 5,0,0
- type: entity
  id: nyash
  components:
    - type: Model
      currentMesh: "/Models/nyash/Nyash.obj"

- type: entity
  id: mambo
  components:
    - type: Model
      currentMesh: 
        path: "/Models/mambo/Mambo.obj"
        scale: 0.02,0.02,0.02
      
- type: entity
  id: femboy
  components:
    - type: Model
      currentMesh: "/Models/femboy/femboy.obj"