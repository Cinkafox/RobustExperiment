- type: entity
  id: machine
  components:
    - type: Model
      currentMesh:
        path: "/Models/machine/machine.obj"
        offset: 0,-2.2,0
    - type: RigidBody
      physType: Static
      restitution: 0
      shape:
        !type:BoxShape
        halfExtents: 1.2, 0.7, 0.9        
         
- type: entity
  id: floor
  components:
    - type: RigidBody
      physType: Static
      restitution: 0
      shape:
        !type:PlaneShape
        distance: 1
    - type: Model
      currentMesh: "/Models/floor/floor.obj"
      
- type: entity
  id: nyash
  components:
    - type: Model
      currentMesh: "/Models/nyash/Nyash.obj"

- type: entity
  id: mambo
  components:
    - type: Model
      currentMesh: 
        path: "/Models/mambo/Mambo.obj"
        scale: 0.02,0.02,0.02
      
- type: entity
  id: femboy
  components:
    - type: Model
      currentMesh: "/Models/femboy/femboy.obj"