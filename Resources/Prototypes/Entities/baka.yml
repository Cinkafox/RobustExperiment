- type: entity
  id: machine
  components:
    - type: Model
      currentMesh:
        path: "/Models/machine/machine.obj"
        offset: 0,-2.2,0
    - type: RigidBody
      physType: Static
      restitution: 0
      shape:
        !type:BoxShape
        halfExtents: 1.2, 0.7, 0.9        

- type: entity
  id: cylinder
  components:
    - type: Model
      currentMesh:
        path: "/Models/car/wheel.obj"
        rotation: 90,0,0
        offset: -8.25,7,-0.35
        scale: 0.3,0.3,0.3
    - type: RigidBody
      friction: 1
      restitution: 0
      density: 30
      rollingResistance: 1
      shape:
        !type:CylinderShape
        radius: 0.5
        height: 0.5      

# TODO: Надо найти оптимальные параметры для тестовой машинки
- type: entity
  id: testConstr
  components:
    - type: Model
      currentMesh:
        path: "/Models/car/body.obj"
        rotation: 0,180,0
        offset: 6.7,-0.4,7.8
        scale: 0.3,0.3,0.3
    - type: RigidBody
      density: 75
      shape:
        !type:BoxShape
        halfExtents: 2.6, 0.2, 0.7
    - type: EntityConstraint
      constraints:
        - entity: cylinder
          components:
            - type: CarWheel
              direction: 0,1,0
              speed: 0
          bodyConstraint: !type:HingeConstraint
            localAnchorA: 1.35, 0, 1.2
            localAnchorB: 0, 0, 0
            axis: 0, 0, 1
            axisB: 0, -1, 0
        - entity: cylinder
          components:
            - type: CarWheelSteering
            - type: CarWheel
              direction: 0,1,0
              speed: 0
          bodyConstraint: !type:HingeConstraint
            localAnchorA: -1.6, 0, 1.2
            localAnchorB: 0, 0, 0
            axis: 0, 0, 1
            axisB: 0, -1, 0
        - entity: cylinder
          components:
            - type: CarWheel
              direction: 0,-1,0
              speed: 0
          bodyConstraint: !type:HingeConstraint
            localAnchorA: 1.35, 0, -1.3
            localAnchorB: 0, 0, 0
            axis: 0, 0, -1
            axisB: 0, -1, 0
        - entity: cylinder
          components:
            - type: CarWheelSteering
            - type: CarWheel
              direction: 0,-1,0
              speed: 0
          bodyConstraint: !type:HingeConstraint
            localAnchorA: -1.6, 0, -1.3
            localAnchorB: 0, 0, 0
            axis: 0, 0, -1
            axisB: 0, -1, 0
        - entity: remote
          offset: 0,3,5

- type: entity
  id: floor
  components:
    - type: RigidBody
      physType: Static
      friction: 1
      shape:
        !type:PlaneShape
        distance: 1
    - type: Model
      currentMesh:
        path: "/Models/ohfuck/yösoghfiösbge.obj"
        scale: 5,5,5
        offset: 5,0,0
- type: entity
  id: nyash
  components:
    - type: Model
      currentMesh: "/Models/nyash/Nyash.obj"
      
- type: entity
  id: femboy
  components:
    - type: Model
      currentMesh: "/Models/femboy/femboy.obj"