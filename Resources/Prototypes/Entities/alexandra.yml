- type: entity
  parent: [baseControlable]
  id: alexandra
  components:
  - type: Health
    maxHealth: 100
  - type: RigidBody
    friction: 3
    restitution: 0.1
    density: 4
    shape:
      !type:BoxShape
      halfExtents: 0.4, 1, 0.4
  - type: Model
    currentMesh:
      path: "/Models/alexandra/untitled_back.obj"
      offset: 0,-1.2,0
  - type: ItemCollector
    boneName: hand
  - type: AlexandraAnimation
  - type: Skeleton
  - type: BoneCompound
    compoundEntId: alexandraSkeleton
    offset: 0,-1.2,0

